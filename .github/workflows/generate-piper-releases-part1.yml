name: Generate Piper Releases (Part 1 - European)

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Select language'
        required: true
        type: choice
        options:
          - 'German (de_DE)'
          - 'French (fr_FR)'
          - 'Spanish ES (es_ES)'
          - 'Spanish AR (es_AR)'
          - 'Spanish MX (es_MX)'
          - 'Italian (it_IT)'
          - 'Portuguese BR (pt_BR)'
          - 'Portuguese PT (pt_PT)'
          - 'Russian (ru_RU)'
          - 'Polish (pl_PL)'
          - 'Dutch (nl_NL)'
          - 'Ukrainian (uk_UA)'
          - 'Romanian (ro_RO)'
          - 'Swedish (sv_SE)'
          - 'Norwegian (nb_NO)'
          - 'Danish (da_DK)'
          - 'Finnish (fi_FI)'
          - 'Czech (cs_CZ)'
          - 'Slovak (sk_SK)'
          - 'Hungarian (hu_HU)'
          - 'Croatian (hr_HR)'
          - 'Serbian (sr_RS)'
          - 'Slovenian (sl_SI)'
          - 'Bulgarian (bg_BG)'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Workspace
        run: mkdir -p target_voice_pack

      - name: Set Language Config
        id: lang_config
        run: |
          python3 << 'PYEOF'
          import os, sys
          lang = os.environ.get("SELECTED_LANG", "")
          config = {
            "German (de_DE)":        ("piper-de",    "German",               "de_DE-thorsten-low,de_DE-thorsten-medium,de_DE-thorsten-high,de_DE-thorsten_emotional-medium,de_DE-kerstin-low,de_DE-r[...]
            "French (fr_FR)":        ("piper-fr",    "French",               "fr_FR-gilles-low,fr_FR-miro-high,fr_FR-siwis-low,fr_FR-siwis-medium,fr_FR-tjiho-model1,fr_FR-tjiho-model2,fr_FR-tjiho-[...]
            "Spanish ES (es_ES)":    ("piper-es-ES", "Spanish Spain",        "es_ES-carlfm-x_low,es_ES-davefx-medium,es_ES-glados-medium,es_ES-miro-high,es_ES-sharvard-medium"),
            "Spanish AR (es_AR)":    ("piper-es-AR", "Spanish Argentina",    "es_AR-daniela-high"),
            "Spanish MX (es_MX)":    ("piper-es-MX", "Spanish Mexico",      "es_MX-ald-medium,es_MX-claude-high"),
            "Italian (it_IT)":       ("piper-it",    "Italian",              "it_IT-dii-high,it_IT-miro-high,it_IT-paola-medium,it_IT-riccardo-x_low"),
            "Portuguese BR (pt_BR)": ("piper-pt-BR", "Portuguese Brazil",    "pt_BR-cadu-medium,pt_BR-dii-high,pt_BR-edresson-low,pt_BR-faber-medium,pt_BR-jeff-medium,pt_BR-miro-high"),
            "Portuguese PT (pt_PT)": ("piper-pt-PT", "Portuguese Portugal",  "pt_PT-dii-high,pt_PT-miro-high,pt_PT-tugao-medium"),
            "Russian (ru_RU)":       ("piper-ru",    "Russian",              "ru_RU-denis-medium,ru_RU-dmitri-medium,ru_RU-irina-medium,ru_RU-ruslan-medium"),
            "Polish (pl_PL)":        ("piper-pl",    "Polish",               "pl_PL-gosia-medium"),
            "Dutch (nl_NL)":         ("piper-nl",    "Dutch",                "nl_NL-mls-medium,nl_NL-mls_5809-low,nl_NL-mls_7432-low"),
            "Ukrainian (uk_UA)":     ("piper-uk",    "Ukrainian",            "uk_UA-lada-x_low,uk_UA-ukrainian_tts-medium"),
            "Romanian (ro_RO)":      ("piper-ro",    "Romanian",             "ro_RO-mihai-medium"),
            "Swedish (sv_SE)":       ("piper-sv",    "Swedish",              "sv_SE-nst-medium"),
            "Norwegian (nb_NO)":     ("piper-nb",    "Norwegian",            "nb_NO-talesyntese-medium"),
            "Danish (da_DK)":        ("piper-da",    "Danish",               "da_DK-talesyntese-medium"),
            "Finnish (fi_FI)":       ("piper-fi",    "Finnish",              "fi_FI-harri-low,fi_FI-harri-medium"),
            "Czech (cs_CZ)":         ("piper-cs",    "Czech",                "cs_CZ-jirka-low,cs_CZ-jirka-medium"),
            "Slovak (sk_SK)":        ("piper-sk",    "Slovak",               "sk_SK-lili-medium"),
            "Hungarian (hu_HU)":     ("piper-hu",    "Hungarian",            "hu_HU-anna-medium,hu_HU-berta-medium"),
            "Croatian (hr_HR)":      ("piper-hr",    "Croatian",             "hr_HR-jakov-medium"),
            "Serbian (sr_RS)":       ("piper-sr",    "Serbian",              "sr_RS-serbski_model-medium"),
            "Slovenian (sl_SI)":     ("piper-sl",    "Slovenian",            "sl_SI-artur-medium"),
            "Bulgarian (bg_BG)":     ("piper-bg",    "Bulgarian",            "bg_BG-krassimira-medium"),
          }
          if lang not in config:
              print(f"ERROR: Unknown language: {lang}", file=sys.stderr)
              sys.exit(1)
          tag, name, models = config[lang]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag_name={tag}\n")
              f.write(f"lang_name={name}\n")
              f.write(f"models={models}\n")
          PYEOF
        env:
          SELECTED_LANG: ${{ github.event.inputs.language }}

      - name: Download and Extract Models
        run: |
          cd target_voice_pack
          GH_BASE="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models"
          IFS=',' read -ra MODEL_LIST <<< "${{ steps.lang_config.outputs.models }}"
          for model_name in "${MODEL_LIST[@]}"; do
            full_name="vits-piper-${model_name}"
            echo "Downloading ${full_name}..."
            wget -q "${GH_BASE}/${full_name}.tar.bz2"
            tar -xf "${full_name}.tar.bz2"
            mv "${full_name}"/*.onnx "${model_name}.onnx"
            if [ -f "${full_name}/tokens.txt" ]; then
              mv "${full_name}/tokens.txt" "${model_name}.tokens.txt"
            else
              mv "${full_name}"/*.txt "${model_name}.tokens.txt" 2>/dev/null || true
            fi
            rm -rf "${full_name}" "${full_name}.tar.bz2"
            echo "Done: ${model_name}"
          done

      - name: Publish Release
  env:
    GH_TOKEN: ${{ github.token }}
  run: |
    cd target_voice_pack
    gh release create ${{ steps.lang_config.outputs.tag_name }} *.onnx *.txt \
      --title "Piper ${{ steps.lang_config.outputs.lang_name }} Models Pack" \
      --notes "Pre-compiled Piper voice models for sherpa-onnx. Source: https://github.com/k2-fsa/sherpa-onnx/releases/tag/tts-models" \
      --repo sonusingh9572/VoxSherpa-TTS
